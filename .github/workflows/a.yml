name: Deploy with Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان نشست به دقیقه'
        required: true
        default: '60'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install firefox
          playwright install-deps

      - name: Run Flask server in background
        run: |
          mkdir -p generated-pictures
          python site.py &
          sleep 10   # منتظر می‌مانیم تا سرور کاملاً بالا بیاید

      - name: Setup Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          echo "🌐 راه‌اندازی تونل Cloudflare..."
          cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
          sleep 5

          TIMEOUT=60
          START_TIME=$(date +%s)
          while true; do
            if ! pgrep cloudflared > /dev/null; then
              echo "⛔ cloudflared از کار افتاد"
              cat cloudflare.log
              exit 1
            fi
            if grep -q 'trycloudflare\.com' cloudflare.log; then
              TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$TUNNEL_URL" ]; then
                echo "✅ تونل ساخته شد: $TUNNEL_URL"
                break
              fi
            fi
            if [ $(( $(date +%s) - START_TIME )) -ge $TIMEOUT ]; then
              echo "❌ تونل در زمان مقرر ساخته نشد"
              cat cloudflare.log
              exit 1
            fi
            sleep 2
          done

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: Update README with initial link
        run: |
          echo "${{ env.TUNNEL_URL }}" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔗 لینک API [skip ci]" || true
          git pull --rebase origin main && git push || echo "⚠️ push اولیه ناموفق (در ادامه دوباره تلاش می‌شود)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep session alive and monitor tunnel
        run: |
          set +e
          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(date -d "$DURATION minutes" +%s)
          TUNNEL_URL="${{ env.TUNNEL_URL }}"
          echo "⏳ سرور تا $DURATION دقیقه فعال خواهد ماند"

          sleep 10

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$TUNNEL_URL/api/status" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "401" ]; then
              echo "❌ تونل پاسخ نمی‌دهد (کد $HTTP_CODE) - راه‌اندازی مجدد..."
              pkill cloudflared || true
              sleep 2
              cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
              sleep 8
              NEW_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$NEW_URL" ]; then
                echo "✅ آدرس جدید: $NEW_URL"
                if [ "$NEW_URL" != "$TUNNEL_URL" ]; then
                  TUNNEL_URL=$NEW_URL
                  echo "$NEW_URL" > README.md
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git commit -m "🔄 به‌روزرسانی لینک تونل [skip ci]" || true
                  git pull --rebase origin main && git push || echo "⚠️ push لینک جدید ناموفق"
                fi
              else
                echo "⚠️ نتوانستیم آدرس جدید را از لاگ بخوانیم"
              fi
            else
              curl -s -o /dev/null "$TUNNEL_URL/api/status" 2>/dev/null || true
            fi

            sleep 30
          done
          echo "زمان به پایان رسید."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}